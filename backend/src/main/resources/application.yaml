spring:
  application:
    name: erro-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/erro}
    username: ${DATABASE_USERNAME:erro}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jdbc:
    template:
      query-timeout: 5s
  flyway:
    default-schema: erro_knowledge
    schemas: erro_knowledge
    clean-disabled: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 5s
      timeout: 5s
      repositories:
        enabled: false

storage:
  s3:
    enabled: ${S3_ENABLED:true}
    endpoint: ${S3_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    path-style-access: ${S3_PATH_STYLE_ACCESS:false}

infrastructure:
  verify-on-startup: ${INFRASTRUCTURE_VERIFY_ON_STARTUP:true}

server:
  port: ${PORT:8080}

chat:
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:5173}

ai:
  endpoint: ${AI_ENDPOINT:https://api.deepseek.com/responses}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-flash}
  reasoning-effort: ${AI_REASONING_EFFORT:none}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
  timeout: ${AI_TIMEOUT:60s}

knowledge:
  admin-token: ${KNOWLEDGE_ADMIN_TOKEN:}
  keyword-top-k: ${RAG_KEYWORD_TOP_K:24}
  vector-top-k: ${RAG_VECTOR_TOP_K:16}
  final-chunks: ${RAG_FINAL_CHUNKS:6}
  max-chunk-chars: ${RAG_MAX_CHUNK_CHARS:1600}
  max-context-chars: ${RAG_MAX_CONTEXT_CHARS:12000}
  min-relevance: ${RAG_MIN_RELEVANCE:0.15}
  embedding-endpoint: ${EMBEDDING_ENDPOINT:}
  embedding-api-key: ${EMBEDDING_API_KEY:}
  embedding-model: ${EMBEDDING_MODEL:}
  embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
