services:
  web:
    image: node:24-alpine
    working_dir: /app
    init: true
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      BACKEND_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  backend:
    build: ./backend
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      AI_ENDPOINT: ${AI_ENDPOINT:-https://api.openai.com/v1/responses}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_TIMEOUT: ${AI_TIMEOUT:-60s}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-http://localhost:5173}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-erro}
      DATABASE_USERNAME: ${POSTGRES_USER:-erro}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-erro-local-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-erro-local-redis}
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE_ACCESS: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-erro-local}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-erro-local-minio-secret}
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erro}
      POSTGRES_USER: ${POSTGRES_USER:-erro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erro-local-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10.1-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-erro-local-redis}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erro-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erro-local-minio-secret}
      MINIO_REGION_NAME: ${AWS_REGION:-us-east-1}
      MINIO_UPDATE: "off"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  web_node_modules:
  postgres_data:
  redis_data:
  minio_data:
