pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    # Polling and cleanup are not charged to the upload limit.
    map $request_method $document_upload_key { default ""; POST $binary_remote_addr; }
    limit_req_zone $document_upload_key zone=document_uploads:1m rate=20r/m;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid recording message bodies, authorization headers, or query strings.
    log_format safe '$request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    server_tokens off;
    include /tmp/nginx-conf/*.conf;
}
